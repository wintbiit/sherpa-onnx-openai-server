[package]
name = "sherpa-onnx-openai-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-openai = { version = "0.40.2", default-features = false, features = ["audio-types"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = "1.13.2"
tokio = { version = "1.38", features = ["macros", "process", "rt-multi-thread", "signal", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
