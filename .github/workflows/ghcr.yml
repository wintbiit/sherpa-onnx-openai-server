name: Build and publish GHCR image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ghcr.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build-push-smoke:
    runs-on: ubuntu-22.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            runtime_image: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04
            provider: cuda
            prebuilt_url: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-v1.13.2-cuda-12.x-cudnn-9.x-linux-x64-gpu.tar.bz2
            tags: |
              ghcr.io/${{ github.repository }}:cuda
              ghcr.io/${{ github.repository }}:cuda-${{ github.sha }}
          - variant: cpu
            runtime_image: debian:bookworm-slim
            provider: cpu
            prebuilt_url: ""
            tags: |
              ghcr.io/${{ github.repository }}:cpu
              ghcr.io/${{ github.repository }}:cpu-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            RUNTIME_IMAGE=${{ matrix.runtime_image }}
            DEFAULT_PROVIDER=${{ matrix.provider }}
            SHERPA_ONNX_PREBUILT_URL=${{ matrix.prebuilt_url }}
          push: true
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.variant }}
            org.opencontainers.image.base.name=${{ matrix.runtime_image }}
            org.opencontainers.image.sherpa-onnx.provider=${{ matrix.provider }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ github.sha }}
        run: |
          docker pull "$IMAGE_REF"
          docker run -d --name tts-smoke -p 8080:8080 \
            -e MOCK_TTS=true \
            -e MODEL_DIR=/tmp/model \
            "$IMAGE_REF"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/v1/audio/speech \
            -H 'Content-Type: application/json' \
            -d '{"model":"tts-1","voice":"alloy","input":"hello from ghcr","response_format":"wav"}' \
            --output /tmp/speech.wav
          test -s /tmp/speech.wav
