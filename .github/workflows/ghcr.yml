name: Build and publish GHCR image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build-push-smoke:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker pull "$IMAGE_REF"
          docker run -d --name tts-smoke -p 8080:8080 \
            -e MOCK_TTS=true \
            -e KOKORO_MODEL=/tmp/model.onnx \
            -e KOKORO_VOICES=/tmp/voices.bin \
            -e KOKORO_TOKENS=/tmp/tokens.txt \
            -e KOKORO_DATA_DIR=/tmp/data \
            "$IMAGE_REF"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/v1/audio/speech \
            -H 'Content-Type: application/json' \
            -d '{"model":"tts-1","voice":"alloy","input":"hello from ghcr","response_format":"wav"}' \
            --output /tmp/speech.wav
          test -s /tmp/speech.wav
